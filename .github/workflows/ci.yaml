name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code  # клонирование репозитория в контейнер, где выполняется job
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4 # настраивает окружение с нужной версией Python
        with:
          python-version: '3.13'

#      - name: Cache pip  # позволяет кешировать зависимости
#        uses: actions/cache@v3
#        with:
#          path: ~/.cache/pip
#          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
#          restore-keys: |
#            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations # выполнение миграций бд для подготовки схемы
        run: python manage.py migrate

      - name: Run tests # запуск тестов для проверки работоспособности приложений
        run: python manage.py test
